name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (package, then playground against the built package)
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build playground
        run: npm run build:playground

      - name: Check the package contents
        run: npm pack --dry-run -w @pgahq/qr-codes
