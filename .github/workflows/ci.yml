name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the package contents
        run: npm pack --dry-run -w @pgahq/qr-codes

      - name: Check that a git install works
        run: |
          node scripts/git-release.mjs --tag ci-git-install
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "git+file://${GITHUB_WORKSPACE}#ci-git-install"
          test -d node_modules/@pgahq/qr-codes/dist
          test ! -e node_modules/next
          node --input-type=module -e "
            for (const entry of ['.', './react', './server', './styles.css']) {
              console.log(entry, '->', import.meta.resolve('@pgahq/qr-codes' + entry.slice(1)))
            }
            const { renderQrSvg } = await import('@pgahq/qr-codes')
            if (!renderQrSvg({ type: 'url', url: 'pga.com' }).startsWith('<svg')) throw new Error('render failed')
          "
