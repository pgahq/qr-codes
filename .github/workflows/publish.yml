name: Publish

# Publishes @pgahq/qr-codes to GitHub Packages (https://github.com/orgs/pgahq/packages).
#
# Release flow:
#   1. Bump "version" in packages/qr-codes/package.json and merge to main.
#   2. Tag the merge commit:  git tag v<version> && git push origin v<version>
#
# Running this workflow manually on a branch only does a dry run.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PACKAGE_DIR: packages/qr-codes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@pgahq"

      - run: npm ci

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            npm publish --dry-run
          else
            npm publish
          fi
